rules:
  - id: hardcoded-secret-fallback
    languages: [typescript, javascript]
    severity: ERROR
    message: >
      A hardcoded string is being used as a fallback for a secret
      (pattern: process.env.X || "literal"). If the environment
      variable is ever unset — a common deploy mistake — this falls
      back to a secret sitting in source control.
    patterns:
      - pattern: process.env.$VAR || "..."
